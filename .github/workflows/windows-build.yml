name: Windows CI (x64 + x86)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 32/64 位编译工具链
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            make \
            perl

      - name: Build Tongsuo for Windows x64
        run: |
          make clean || true
          export CROSS_PREFIX=x86_64-w64-mingw32
          ./Configure \
            shared \
            enable-ntls \
            no-asm \
            no-async \
            mingw64 \
            --prefix=/tmp/tongsuo-win64 \
            --cross-compile-prefix=${CROSS_PREFIX}- \
            -Wno-error
          make -j$(nproc)
          make install_sw

      - name: Build Tongsuo for Windows x86
        run: |
          make clean || true
          export CROSS_PREFIX=i686-w64-mingw32
          ./Configure \
            shared \
            enable-ntls \
            no-asm \
            no-async \
            mingw \
            --prefix=/tmp/tongsuo-win32 \
            --cross-compile-prefix=${CROSS_PREFIX}- \
            -Wno-error
          make -j$(nproc)
          make install_sw

      - name: Check build output
        run: |
          echo "=== x64 构建产物 ==="
          ls -la /tmp/tongsuo-win64/bin/
          echo -e "\n=== x86 构建产物 ==="
          ls -la /tmp/tongsuo-win32/bin/

      - name: Prepare and package x64
        run: |
          mkdir -p dist/tongsuo-windows-x64/{bin,include,lib}
          if [ -f "/tmp/tongsuo-win64/bin/openssl.exe" ]; then
            cp /tmp/tongsuo-win64/bin/openssl.exe dist/tongsuo-windows-x64/bin/tongsuo.exe
          else
            cp /tmp/tongsuo-win64/bin/tongsuo.exe dist/tongsuo-windows-x64/bin/
          fi
          find /tmp/tongsuo-win64/bin -name "*.dll" -exec cp {} dist/tongsuo-windows-x64/bin/ \;
          cp -r /tmp/tongsuo-win64/include/* dist/tongsuo-windows-x64/include/ 2>/dev/null || true
          cp -r /tmp/tongsuo-win64/lib/* dist/tongsuo-windows-x64/lib/ 2>/dev/null || true
          cd dist && zip -r tongsuo-windows-x64.zip tongsuo-windows-x64

      - name: Prepare and package x86
        run: |
          mkdir -p dist/tongsuo-windows-x86/{bin,include,lib}
          if [ -f "/tmp/tongsuo-win32/bin/openssl.exe" ]; then
            cp /tmp/tongsuo-win32/bin/openssl.exe dist/tongsuo-windows-x86/bin/tongsuo.exe
          else
            cp /tmp/tongsuo-win32/bin/tongsuo.exe dist/tongsuo-windows-x86/bin/
          fi
          find /tmp/tongsuo-win32/bin -name "*.dll" -exec cp {} dist/tongsuo-windows-x86/bin/ \;
          cp -r /tmp/tongsuo-win32/include/* dist/tongsuo-windows-x86/include/ 2>/dev/null || true
          cp -r /tmp/tongsuo-win32/lib/* dist/tongsuo-windows-x86/lib/ 2>/dev/null || true
          cd dist && zip -r tongsuo-windows-x86.zip tongsuo-windows-x86

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-windows-x64
          path: dist/tongsuo-windows-x64.zip

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-windows-x86
          path: dist/tongsuo-windows-x86.zip

      - name: Create Release with both versions
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tongsuo-windows-x64.zip
            dist/tongsuo-windows-x86.zip
          name: Tongsuo ${{ github.ref_name }} Windows (x64 + x86)
          body: |
            Tongsuo ${{ github.ref_name }} Windows 预编译包

            ## 包含版本
            - ✅ Windows x86_64 (64位)
            - ✅ Windows x86 (32位)

            ## 特性
            - 国密算法支持：SM2/SM3/SM4/SM9/NTLS
            - 开箱即用，无需安装运行库
            - 包含 tongsuo.exe + 全部依赖 DLL
            - 附带头文件与库文件
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
