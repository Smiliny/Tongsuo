name: Windows CI (x64 + x86)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            make \
            perl

      # ====================== 构建 64 位版本 ======================
      - name: Build Tongsuo for Windows x64
        run: |
          make clean || true
          export CROSS_PREFIX=x86_64-w64-mingw32
          ./Configure \
            shared \
            enable-ntls \
            no-asm \
            no-async \
            mingw64 \
            --prefix=/tmp/tongsuo-win64 \
            --cross-compile-prefix=${CROSS_PREFIX}- \
            -Wno-error
          make -j$(nproc)
          make install_sw

      # ====================== 构建 32 位版本 ======================
      - name: Build Tongsuo for Windows x86
        run: |
          make clean || true
          export CROSS_PREFIX=i686-w64-mingw32
          ./Configure \
            shared \
            enable-ntls \
            no-asm \
            no-async \
            mingw \
            --prefix=/tmp/tongsuo-win32 \
            --cross-compile-prefix=${CROSS_PREFIX}- \
            -Wno-error
          make -j$(nproc)
          make install_sw

      # 检查构建输出
      - name: Check build output
        run: |
          echo "Checking build output in /tmp/tongsuo-win64/bin:"
          ls -la /tmp/tongsuo-win64/bin/
          echo "Checking build output in /tmp/tongsuo-win32/bin:"
          ls -la /tmp/tongsuo-win32/bin/
          echo "Checking current directory:"
          ls -la

      # ====================== 打包 x64 ======================
      - name: Prepare distribution directory x64
        run: |
          mkdir -p dist/tongsuo-windows-x64/{bin,include,lib}
          if [ -f "/tmp/tongsuo-win64/bin/openssl.exe" ]; then
            echo "Found openssl.exe, copying..."
            cp /tmp/tongsuo-win64/bin/openssl.exe dist/tongsuo-windows-x64/bin/tongsuo.exe
          elif [ -f "/tmp/tongsuo-win64/bin/tongsuo.exe" ]; then
            echo "Found tongsuo.exe, copying..."
            cp /tmp/tongsuo-win64/bin/tongsuo.exe dist/tongsuo-windows-x64/bin/
          else
            echo "ERROR: No executable found in /tmp/tongsuo-win64/bin/"
            ls -la /tmp/tongsuo-win64/bin/
            exit 1
          fi
          find /tmp/tongsuo-win64/bin -name "*.dll" -exec cp {} dist/tongsuo-windows-x64/bin/ \; || echo "No DLL files found"
          echo "Files in dist/tongsuo-windows-x64/bin/:"
          ls -la dist/tongsuo-windows-x64/bin/
          if [ -d "/tmp/tongsuo-win64/include" ]; then
            cp -r /tmp/tongsuo-win64/include/* dist/tongsuo-windows-x64/include/
          fi
          if [ -d "/tmp/tongsuo-win64/lib" ]; then
            cp -r /tmp/tongsuo-win64/lib/* dist/tongsuo-windows-x64/lib/ 2>/dev/null || true
          fi
          cd dist
          zip -r tongsuo-windows-x64.zip tongsuo-windows-x64
          echo "ZIP file created:"
          ls -la tongsuo-windows-x64.zip

      # ====================== 打包 x86 ======================
      - name: Prepare distribution directory x86
        run: |
          mkdir -p dist/tongsuo-windows-x86/{bin,include,lib}
          if [ -f "/tmp/tongsuo-win32/bin/openssl.exe" ]; then
            echo "Found openssl.exe, copying..."
            cp /tmp/tongsuo-win32/bin/openssl.exe dist/tongsuo-windows-x86/bin/tongsuo.exe
          elif [ -f "/tmp/tongsuo-win32/bin/tongsuo.exe" ]; then
            echo "Found tongsuo.exe, copying..."
            cp /tmp/tongsuo-win32/bin/tongsuo.exe dist/tongsuo-windows-x86/bin/
          else
            echo "ERROR: No executable found in /tmp/tongsuo-win32/bin/"
            ls -la /tmp/tongsuo-win32/bin/
            exit 1
          fi
          find /tmp/tongsuo-win32/bin -name "*.dll" -exec cp {} dist/tongsuo-windows-x86/bin/ \; || echo "No DLL files found"
          echo "Files in dist/tongsuo-windows-x86/bin/:"
          ls -la dist/tongsuo-windows-x86/bin/
          if [ -d "/tmp/tongsuo-win32/include" ]; then
            cp -r /tmp/tongsuo-win32/include/* dist/tongsuo-windows-x86/include/
          fi
          if [ -d "/tmp/tongsuo-win32/lib" ]; then
            cp -r /tmp/tongsuo-win32/lib/* dist/tongsuo-windows-x86/lib/ 2>/dev/null || true
          fi
          cd dist
          zip -r tongsuo-windows-x86.zip tongsuo-windows-x86
          echo "ZIP file created:"
          ls -la tongsuo-windows-x86.zip

      # 上传构建产物
      - name: Upload artifact x64
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-windows-x64
          path: dist/tongsuo-windows-x64.zip

      - name: Upload artifact x86
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-windows-x86
          path: dist/tongsuo-windows-x86.zip

      # 发布 Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tongsuo-windows-x64.zip
            dist/tongsuo-windows-x86.zip
          name: Tongsuo ${{ github.ref_name }} Windows (x64 + x86)
          body: |
            Tongsuo ${{ github.ref_name }} Windows 预编译包

            - Windows x86_64 (64位)
            - Windows x86 (32位)
            - 包含 tongsuo.exe 及所有依赖 DLL
            - 支持国密算法 SM2/SM3/SM4/SM9
            - 开箱即用
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
