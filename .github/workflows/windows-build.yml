name: Windows CI & Release

on:
  workflow_dispatch:
  # 建议改为 push tags 触发，更符合自动化习惯
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用矩阵策略同时构建 x64 和 x86
    strategy:
      matrix:
        include:
          - arch: x64
            mingw_pkg: gcc-mingw-w64-x86-64
            cross_prefix: x86_64-w64-mingw32
            target: mingw64
            install_prefix: /tmp/tongsuo-win64
            zip_name: tongsuo-windows-x64
          - arch: x86
            mingw_pkg: gcc-mingw-w64-i686
            cross_prefix: i686-w64-mingw32
            target: mingw
            install_prefix: /tmp/tongsuo-win32
            zip_name: tongsuo-windows-x86

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and dependencies
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.mingw_pkg }} make perl

      - name: Build Tongsuo for Windows ${{ matrix.arch }}
        run: |
          export CROSS_PREFIX=${{ matrix.cross_prefix }}
          ./Configure \
            shared \
            enable-ntls \
            no-asm \
            no-async \
            ${{ matrix.target }} \
            --prefix=${{ matrix.install_prefix }} \
            --cross-compile-prefix=${CROSS_PREFIX}- \
            -Wno-error 
          make -j$(nproc)
          make install_sw

      - name: Prepare distribution directory
        run: |
          mkdir -p dist/${{ matrix.zip_name }}/{bin,include,lib}
          
          # 智能查找并复制可执行文件
          if [ -f "${{ matrix.install_prefix }}/bin/openssl.exe" ]; then
            cp ${{ matrix.install_prefix }}/bin/openssl.exe dist/${{ matrix.zip_name }}/bin/tongsuo.exe
          elif [ -f "${{ matrix.install_prefix }}/bin/tongsuo.exe" ]; then
            cp ${{ matrix.install_prefix }}/bin/tongsuo.exe dist/${{ matrix.zip_name }}/bin/
          else
            echo "ERROR: No executable found!"
            ls -la ${{ matrix.install_prefix }}/bin/ || true
            exit 1
          fi
          
          # 复制依赖 DLL
          find ${{ matrix.install_prefix }}/bin -name "*.dll" -exec cp {} dist/${{ matrix.zip_name }}/bin/ \; 2>/dev/null || true
          
          # 复制头文件和库文件
          cp -r ${{ matrix.install_prefix }}/include/* dist/${{ matrix.zip_name }}/include/ 2>/dev/null || true
          cp -r ${{ matrix.install_prefix }}/lib/* dist/${{ matrix.zip_name }}/lib/ 2>/dev/null || true

      - name: Package as ZIP archive
        run: |
          cd dist
          zip -r ${{ matrix.zip_name }}.zip ${{ matrix.zip_name }}
          ls -la ${{ matrix.zip_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: dist/${{ matrix.zip_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tongsuo-windows-x64.zip
            dist/tongsuo-windows-x86.zip
          name: Tongsuo ${{ github.ref_name }} Windows x64 + x86
          body: |
            Tongsuo ${{ github.ref_name }} Windows 预编译包

            - Windows x86_64 (64位)
            - Windows x86 (32位)
            - 包含 tongsuo.exe 及所有依赖 DLL
            - 支持国密算法 SM2/SM3/SM4/SM9
            - 开箱即用
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
